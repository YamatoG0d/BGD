<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ректорский тест по БЖД</title>
<style>
html{-webkit-text-size-adjust:100%}
/* Layout: одна узкая колонка-«бланк» по центру; сверху шапка с прогрессом, ниже карточка задания. */
:root{
  --bg:#F2F5F1;
  --surface:#FFFFFF;
  --ink:#152019;
  --muted:#5A6A60;
  --line:#D3DCD5;
  --accent:#157A4B;      /* зелёный знаков эвакуации */
  --accent-soft:#E2F1E8;
  --on-accent:#FFFFFF;
  --ok:#1C8549;
  --ok-soft:#E1F3E7;
  --bad:#BE3328;
  --bad-soft:#FBE7E4;
  --warn:#A86A00;
  --warn-soft:#FFF3D6;
  --font-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --font-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1411;--surface:#16201A;--ink:#E4ECE6;--muted:#93A399;--line:#2A372F;
  --accent:#3DBE7F;--accent-soft:#183326;--on-accent:#06130C;
  --ok:#45C47F;--ok-soft:#163222;--bad:#F06A5C;--bad-soft:#3A1915;--warn:#F2B33D;--warn-soft:#352812;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411;--surface:#16201A;--ink:#E4ECE6;--muted:#93A399;--line:#2A372F;
  --accent:#3DBE7F;--accent-soft:#183326;--on-accent:#06130C;
  --ok:#45C47F;--ok-soft:#163222;--bad:#F06A5C;--bad-soft:#3A1915;--warn:#F2B33D;--warn-soft:#352812;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,6vw,36px);letter-spacing:-.01em}
h2{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:13px;letter-spacing:.02em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* шапка */
.top{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}

/* карточки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:12px;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:19px;font-weight:600;line-height:1.4}
.lead{color:var(--muted);font-size:16px}
.instr{font-size:14px;color:var(--muted)}

/* варианты */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .num{font-family:var(--font-mono);font-size:14px;min-width:22px;height:22px;display:grid;place-items:center;border-radius:4px;border:1.5px solid var(--line);flex:none}
.opt.multi .num{border-radius:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .num{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .num{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}

/* последовательность */
.seq{display:flex;flex-direction:column;gap:8px}
.slot{min-height:46px;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:15px}
.slot.filled{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.slot .pos{font-family:var(--font-mono);font-size:14px;color:var(--accent);min-width:22px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:15px;align-self:flex-start}

/* соответствие */
.rightlist{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:8px;background:var(--bg);font-size:15px}
.rightlist div{display:flex;gap:10px}
.rightlist b{font-family:var(--font-mono);color:var(--accent);min-width:18px}
.match{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px}
.mrow.right{border-color:var(--ok);background:var(--ok-soft)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mrow span{min-width:0}
select{font:inherit;font-family:var(--font-mono);font-size:15px;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:64px}

/* верно/неверно */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600}

/* ввод */
input[type=text]{font:inherit;font-size:18px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=text].right{border-color:var(--ok);background:var(--ok-soft)}
input[type=text].wrong{border-color:var(--bad);background:var(--bad-soft)}

/* разбор */
.fb{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:8px;font-size:16px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb strong{font-weight:700}
.note{padding:12px 14px;border-radius:8px;background:var(--warn-soft);border-left:4px solid var(--warn);font-size:15px}

/* кнопки */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 20px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}

/* старт */
.sections{display:flex;flex-direction:column;gap:8px}
.sec{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.sec input{width:18px;height:18px;accent-color:var(--accent)}
.sec .cnt{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.last{font-size:15px}

/* итог */
.score{font-family:var(--font-display);font-size:clamp(44px,12vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--muted);font-weight:500}
.breakdown{display:flex;flex-direction:column;gap:6px;font-size:15px}
.breakdown div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.breakdown span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mist{display:flex;flex-direction:column;gap:12px}
.mist article{padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.mist .q{font-weight:600}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

</head>
<body>
<main class="wrap" id="app"></main>

<script>
(()=>{
'use strict';
const SECTIONS=[

/* Вопросы и ключ — из материалов к ректорскому тестированию (RTF и презентация). */
const Q=[
 {n:1,t:'single',i:ONE,q:'Альфа-излучение представляет собой',o:['поток электронов','поток ядер гелия','поток ядерных частиц, не имеющих электрического заряда','поток нейтронов'],a:[2]},

 {n:3,t:'single',i:ONE,q:'За охрану труда на производственном участке отвечает:',o:['специалист по охране труда','старший общественный инспектор по охране труда','технический инспектор по охране труда','руководитель производственного участка'],a:[4],note:'Если ответ нужно ввести словами, пишите три слова: «руководитель производственного участка».'},
 {n:4,t:'multi',i:THREE,q:'По ТК РФ виновные за нарушение требований безопасности на производстве несут ответственность:',o:['социальную','дисциплинарную','моральную','административную','уголовную'],a:[2,4,5]},

 {n:22,t:'order',q:'Укажите правильную последовательность оказания первой помощи при неотложных ситуациях',o:['Проведите первичный осмотр пострадавшего и окажите первую помощь при состояниях, угрожающих его жизни','Вызовите скорую помощь','Осмотрите место происшествия','Проведите вторичный осмотр пострадавшего и при необходимости окажите помощь при выявлении других проблем'],a:[3,1,2,4],note:'Сначала осмотреть место происшествия. Потом: первичный осмотр, скорая помощь, вторичный осмотр.'},
 {n:23,t:'order',q:'Укажите последовательность действий при проникающем ранении грудной клетки, при условии сохранения сознания у пострадавшего',o:['вызвать скорую медицинскую помощь','перевести пострадавшего в полусидящее положение','наложить герметичную повязку','прижать ладонь к ране, закрывая доступ воздуха'],a:[4,3,2,1],note:'Сначала прижать ладонь к ране. Потом: герметичная повязка, полусидящее положение, скорая помощь.'},

 {n:60,t:'input',q:'Единица измерения громкости — …',a:['децибел'],alt:['дб','децибелы']},
];
const BY=Object.fromEntries(Q.map(x=>[x.n,x]));
const secOf=n=>SECTIONS.find(s=>n>=s.range[0]&&n<=s.range[1]);
const LET='АБВГДЕ';

/* ---------- хранилище (только удобство, страница работает и без него) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem('bzhd:'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bzhd:'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- состояние ---------- */
let S={phase:'start',mode:store.get('mode','train'),shuffle:store.get('shuffle',false),secs:[1,2,3,4,5],queue:[],idx:0,answers:{},checked:false,cur:null};

const app=document.getElementById('app');
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};
const put=(el,...kids)=>el.append(...kids.filter(k=>k!=null&&k!==false));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- проверка ответа ---------- */
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"]/g,'').replace(/\s+/g,' ').replace(/[.!;:]+$/,'').trim();
function isEmpty(q,v){
  if(v==null)return true;
  if(q.t==='single'||q.t==='multi')return !v.length;
  if(q.t==='order')return v.length<q.o.length;
  if(q.t==='match')return v.some(x=>!x);
  if(q.t==='tf')return typeof v!=='boolean';
  if(q.t==='input')return !norm(v);
  return true;
}
function isRight(q,v){
  if(isEmpty(q,v))return false;
  if(q.t==='single'||q.t==='multi'){const a=[...v].sort((x,y)=>x-y);return a.length===q.a.length&&a.every((x,i)=>x===q.a[i]);}
  if(q.t==='order'||q.t==='match')return v.every((x,i)=>x===q.a[i]);
  if(q.t==='tf')return v===q.a;
  if(q.t==='input'){const s=norm(v);return [...q.a,...q.alt].some(x=>norm(x)===s);}
}
function answerText(q){
  if(q.t==='single'||q.t==='multi')return q.a.map(i=>i+'. '+q.o[i-1]).join('; ');
  if(q.t==='order')return 'Порядок: '+q.a.join(', ');
  if(q.t==='match')return q.a.map((r,i)=>(i+1)+' — '+LET[r-1]).join(', ');
  if(q.t==='tf')return q.a?'Верно':'Неверно';
  if(q.t==='input')return q.a[0];
}

/* ---------- экраны ---------- */
function render(){
  app.replaceChildren();
  if(S.phase==='start')renderStart();
  else if(S.phase==='quiz')renderQuiz();
  else renderResult();
  window.scrollTo({top:0});
}

function renderStart(){
  const last=store.get('last',null), mistakes=store.get('mistakes',[]);
  const secRows=SECTIONS.map(s=>{
    const cb=h('input',{type:'checkbox',id:'sec'+s.id,checked:S.secs.includes(s.id),onchange:e=>{S.secs=e.target.checked?[...S.secs,s.id].sort():S.secs.filter(x=>x!==s.id);startBtn.disabled=!S.secs.length;}});
    return h('label',{class:'sec',for:'sec'+s.id},cb,h('span',{},s.name),h('span',{class:'cnt'},'№ '+s.range[0]+'–'+s.range[1]));
  });
  const modeChip=(id,label)=>h('button',{type:'button',class:'chip','aria-pressed':String(S.mode===id),onclick:()=>{S.mode=id;store.set('mode',id);render();}},label);
  const startBtn=h('button',{class:'btn',type:'button',id:'start',onclick:()=>begin(Q.filter(q=>S.secs.includes(secOf(q.n).id)).map(q=>q.n))},'Начать');
  startBtn.disabled=!S.secs.length;
  put(app,
    h('header',{class:'top'},
      h('span',{class:'eyebrow'},'Безопасность жизнедеятельности'),
      h('h1',{},'Ректорский тест по БЖД'),
      h('p',{class:'muted'},'60 заданий в формате тестирования: выбор ответа, последовательность, соответствие, верно/неверно и ввод слова.')),
    h('section',{class:'card'},
      h('h2',{},'Разделы'),
      h('div',{class:'sections'},secRows),
      h('h2',{},'Режим'),
      h('div',{class:'row'},modeChip('train','Тренировка: ответ сразу'),modeChip('exam','Экзамен: ответы в конце')),
      h('label',{class:'sec',for:'shuf',style:'grid-template-columns:auto 1fr'},
        h('input',{type:'checkbox',id:'shuf',checked:S.shuffle,onchange:e=>{S.shuffle=e.target.checked;store.set('shuffle',S.shuffle);}}),
        h('span',{},'Перемешать задания')),
      h('div',{class:'actions'},startBtn,
        mistakes.length?h('button',{class:'btn ghost',type:'button',onclick:()=>begin(mistakes)},'Повторить ошибки ('+mistakes.length+')'):null),
      last?h('p',{class:'last muted'},'Прошлый результат: '+last.right+' из '+last.total+' ('+Math.round(last.right/last.total*100)+'%).'):null)
  );
}

function begin(list){
  S.queue=S.shuffle?shuffle(list):list.slice();
  S.idx=0;S.answers={};S.checked=false;S.phase='quiz';S.cur=null;
  render();
}

function renderQuiz(){
  const n=S.queue[S.idx],q=BY[n],sec=secOf(n);
  if(S.cur==null)S.cur=S.answers[n]!=null?S.answers[n]:initVal(q);
  const done=S.idx/S.queue.length*100;
  const bar=h('div',{class:'bar'},h('i',{style:'width:'+done+'%'}));
  const card=h('section',{class:'card','aria-live':'polite'});
  put(card,
    h('div',{class:'qhead'},h('span',{class:'tag'},'Задание № '+n),h('span',{class:'mono muted'},sec.name)),
    q.lead?h('p',{class:'lead'},q.lead):null,
    h('p',{class:'qtext'},q.q),
    q.i?h('p',{class:'instr'},q.i):null,
    body(q),
  );
  if(S.checked&&S.mode==='train'){
    const ok=isRight(q,S.cur);
    put(card,h('div',{class:'fb '+(ok?'ok':'no')},h('strong',{},ok?'Верно':'Неверно'),ok?null:h('span',{},'Правильный ответ: '+answerText(q))));
    if(q.note)put(card,h('p',{class:'note'},q.note));
  }else if(q.note&&q.t==='input'){put(card,h('p',{class:'note'},q.note));}
  const primary=h('button',{class:'btn',type:'button',id:'primary',onclick:onPrimary});
  if(S.mode==='train'&&!S.checked){primary.textContent='Проверить';primary.disabled=isEmpty(q,S.cur);}
  else primary.textContent=S.idx===S.queue.length-1?'Завершить':'Дальше';
  if(S.mode==='exam')primary.disabled=false;
  put(card,h('div',{class:'actions'},primary,
    h('button',{class:'btn ghost',type:'button',onclick:()=>{if(!isEmpty(q,S.cur))S.answers[n]=S.cur;finish(true);}},'Закончить тест')));
  put(app,
    h('header',{class:'top'},
      h('div',{class:'meta'},h('span',{},'Вопрос '+(S.idx+1)+' из '+S.queue.length),h('span',{},S.mode==='train'?'Тренировка':'Экзамен')),bar),
    card);
}

function initVal(q){
  if(q.t==='single'||q.t==='multi'||q.t==='order')return [];
  if(q.t==='match')return q.l.map(()=>0);
  if(q.t==='tf')return null;
  return '';
}
function refreshPrimary(q){
  const b=document.getElementById('primary');
  if(b&&S.mode==='train'&&!S.checked)b.disabled=isEmpty(q,S.cur);
}
function onPrimary(){
  const n=S.queue[S.idx],q=BY[n];
  if(S.mode==='train'&&!S.checked){if(isEmpty(q,S.cur))return;S.answers[n]=S.cur;S.checked=true;render();return;}
  S.answers[n]=S.cur;
  if(S.idx<S.queue.length-1){S.idx++;S.checked=false;S.cur=null;render();}
  else finish();
}

function body(q){
  const locked=S.checked&&S.mode==='train';
  if(q.t==='single'||q.t==='multi'){
    return h('div',{class:'opts',role:q.t==='single'?'radiogroup':'group'},q.o.map((txt,i)=>{
      const k=i+1,sel=S.cur.includes(k);
      let cls='opt'+(q.t==='multi'?' multi':'')+(sel?' sel':'');
      if(locked){if(q.a.includes(k))cls='opt right';else if(sel)cls='opt wrong';}
      return h('button',{type:'button',class:cls,disabled:locked,role:q.t==='single'?'radio':'checkbox','aria-checked':String(sel),onclick:()=>{
        if(q.t==='single')S.cur=[k];else S.cur=sel?S.cur.filter(x=>x!==k):[...S.cur,k];
        render();}},h('span',{class:'num'},String(k)),h('span',{},txt));
    }));
  }
  if(q.t==='order'){
    const wrap=h('div',{class:'opts'});
    wrap.append(h('p',{class:'instr'},'Нажимайте на действия по порядку: первое, второе и так далее.'));
    q.o.forEach((txt,i)=>{
      const k=i+1,pos=S.cur.indexOf(k);
      let cls='opt'+(pos>=0?' sel':'');
      if(locked){cls='opt '+(S.cur[q.a.indexOf(k)]===k?'right':'wrong');}
      wrap.append(h('button',{type:'button',class:cls,disabled:locked,onclick:()=>{
        S.cur=pos>=0?S.cur.filter(x=>x!==k):[...S.cur,k];render();}},
        h('span',{class:'num'},pos>=0?String(pos+1):''),h('span',{},k+'. '+txt)));
    });
    if(!locked&&S.cur.length)wrap.append(h('button',{type:'button',class:'linkbtn',onclick:()=>{S.cur=[];render();}},'Сбросить порядок'));
    wrap.append(h('p',{class:'mono muted'},'Ваш порядок: '+(S.cur.length?S.cur.join(', '):'—')));
    return wrap;
  }
  if(q.t==='match'){
    const right=h('div',{class:'rightlist'},q.r.map((t,i)=>h('div',{},h('b',{},LET[i]),h('span',{},t))));
    const rows=h('div',{class:'match'},q.l.map((t,i)=>{
      const sel=h('select',{id:'m'+q.n+'_'+i,'aria-label':'Соответствие для: '+t,disabled:locked,onchange:e=>{S.cur=S.cur.slice();S.cur[i]=+e.target.value;refreshPrimary(q);}},
        h('option',{value:'0'},'—'),q.r.map((_,j)=>{const o=h('option',{value:String(j+1)},LET[j]);if(S.cur[i]===j+1)o.selected=true;return o;}));
      const cls='mrow'+(locked?(S.cur[i]===q.a[i]?' right':' wrong'):'');
      return h('div',{class:cls},h('span',{},(i+1)+'. '+t),sel);
    }));
    return h('div',{class:'opts'},right,rows);
  }
  if(q.t==='tf'){
    const mk=(val,label)=>{
      let cls='opt'+(S.cur===val?' sel':'');
      if(locked){if(q.a===val)cls='opt right';else if(S.cur===val)cls='opt wrong';}
      return h('button',{type:'button',class:cls,disabled:locked,'aria-pressed':String(S.cur===val),onclick:()=>{S.cur=val;render();}},label);
    };
    return h('div',{class:'tf'},mk(true,'Верно'),mk(false,'Неверно'));
  }
  if(q.t==='input'){
    const inp=h('input',{type:'text',id:'inp'+q.n,autocomplete:'off',autocapitalize:'off',spellcheck:'false',placeholder:'Введите ответ',value:S.cur||'',readonly:locked,
      class:locked?(isRight(q,S.cur)?'right':'wrong'):'',
      oninput:e=>{S.cur=e.target.value;refreshPrimary(q);},
      onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();onPrimary();}}});
    if(!locked)setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},0);
    return inp;
  }
}

function finish(early){
  const list=early?S.queue.filter(n=>n in S.answers):S.queue.slice();
  if(!list.length){S.phase='start';render();return;}
  S.phase='result';
  const wrong=list.filter(n=>!isRight(BY[n],S.answers[n]));
  const right=list.length-wrong.length;
  store.set('last',{right,total:list.length});
  store.set('mistakes',wrong);
  S.result={right,total:list.length,wrong,list};
  render();
}

function renderResult(){
  const {right,total,wrong,list}=S.result||{right:0,total:0,wrong:[],list:[]};
  const pct=total?Math.round(right/total*100):0;
  const perSec=SECTIONS.map(s=>{const ns=list.filter(n=>secOf(n).id===s.id);if(!ns.length)return null;const r=ns.filter(n=>isRight(BY[n],S.answers[n])).length;return h('div',{},h('span',{},s.name),h('span',{},r+' / '+ns.length));}).filter(Boolean);
  const mist=wrong.map(n=>{const q=BY[n],v=S.answers[n];
    return h('article',{},h('span',{class:'tag',style:'align-self:flex-start'},'Задание № '+n),h('span',{class:'q'},q.q),
      h('span',{},'Ваш ответ: '+(isEmpty(q,v)?'нет ответа':userText(q,v))),
      h('span',{},'Правильно: '+answerText(q)),
      q.note?h('span',{class:'muted'},q.note):null);});
  put(app,
    h('header',{class:'top'},h('span',{class:'eyebrow'},'Итог'),h('h1',{},pct>=85?'Отлично, вы готовы':pct>=60?'Неплохо, повторите ошибки':'Нужно повторить')),
    h('section',{class:'card'},
      h('div',{class:'score'},String(right),h('small',{},' из '+total+' · '+pct+'%')),
      h('div',{class:'breakdown'},perSec),
      h('div',{class:'actions'},
        wrong.length?h('button',{class:'btn',type:'button',onclick:()=>begin(wrong)},'Повторить ошибки ('+wrong.length+')'):null,
        h('button',{class:wrong.length?'btn ghost':'btn',type:'button',onclick:()=>{S.phase='start';render();}},'К началу'))),
    wrong.length?h('section',{class:'mist'},h('h2',{},'Ошибки'),mist):null);
}
function userText(q,v){
  if(q.t==='single'||q.t==='multi')return [...v].sort((a,b)=>a-b).map(i=>i+'. '+q.o[i-1]).join('; ');
  if(q.t==='order')return v.join(', ');
  if(q.t==='match')return v.map((r,i)=>(i+1)+' — '+(r?LET[r-1]:'?')).join(', ');
  if(q.t==='tf')return v?'Верно':'Неверно';
  return String(v);
}

/* Enter = основная кнопка */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||S.phase!=='quiz')return;
  const t=e.target;if(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='BUTTON')return;
  const b=document.getElementById('primary');if(b&&!b.disabled){e.preventDefault();b.click();}
});

/* сохранить прогресс при обновлении страницы */
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({S}));
const start=data=>{if(data&&data.S)S=data.S;render();};
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
</script>
